<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT - Huynh Khac Vinh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260203-41">
    <style>
        .page-content {
            padding: var(--space-xl) var(--gutter);
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }
        .page-title {
            font-family: 'Epilogue', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: var(--space-md);
            font-weight: 300;
        }
        .page-subtitle {
            font-size: var(--h3);
            color: var(--text-secondary);
            max-width: 600px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-gradient-bar"></div>
        <div class="header-container">
            <a href="index.html" class="header-logo">
                <span class="header-name">VINH</span>
                <span class="header-divider">|</span>
                <div class="header-title">
                    <span>Artist Designer</span>
                    <span class="separator">•</span>
                    <span>Creative Director</span>
                </div>
            </a>
            
            <button class="hamburger-btn" aria-label="Menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </header>

    <!-- Menu Overlay -->
    <div class="menu-overlay">
        <button class="menu-close-btn" aria-label="Close Menu">×</button>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html" class="menu-link">INDEX</a></li>
            <li class="menu-item"><a href="portfolio.html" class="menu-link">ARCHIVE</a></li>
            <li class="menu-item"><a href="knowledge-sharing.html" class="menu-link">THE LAB</a></li>
            <li class="menu-item"><a href="profile.html" class="menu-link">IDENTITY</a></li>
            <li class="menu-item"><a href="say-hi.html" class="menu-link">CONNECT</a></li>
        </ul>
    </div>

    <main class="container page-content">
        <h1 class="page-title">CONNECT</h1>
        <p class="page-subtitle">Let's start a conversation. I'm always open to discussing new projects, creative ideas or opportunities to be part of your visions.</p>
    </main>

    <script>
        // Menu Toggle Logic
        const hamburgerBtn = document.querySelector('.hamburger-btn');
        const menuCloseBtn = document.querySelector('.menu-close-btn');
        const menuOverlay = document.querySelector('.menu-overlay');
        const body = document.body;

        function toggleMenu() {
            hamburgerBtn.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            
            // Prevent scrolling when menu is open
            if (menuOverlay.classList.contains('active')) {
                body.style.overflow = 'hidden';
            } else {
                body.style.overflow = '';
            }
        }

        hamburgerBtn.addEventListener('click', toggleMenu);
        menuCloseBtn.addEventListener('click', toggleMenu);

        // Close menu when clicking a link
        const menuLinks = document.querySelectorAll('.menu-link');
        const currentPath = window.location.pathname.split('/').pop() || 'index.html';

        menuLinks.forEach(link => {
            const linkPath = link.getAttribute('href');
            
            // Hide current page link (UX requirement)
            if (linkPath === currentPath) {
                link.closest('.menu-item').classList.add('current-page');
            }

            link.addEventListener('click', () => {
                hamburgerBtn.classList.remove('active');
                menuOverlay.classList.remove('active');
                body.style.overflow = '';
            });
        });
    </script>
</body>
</html>
