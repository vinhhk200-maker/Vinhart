	<script>
		async function inlineAvatar() {
			try {
				var imgs = document.querySelectorAll('.overlay-avatar, .hint-avatar');
				if (!imgs || !imgs.length) return;
				const res = await fetch('../images/VINH_Port.png', { cache: 'no-store' });
				if (!res.ok) return;
				const blob = await res.blob();
				const reader = new FileReader();
				reader.onloadend = function() {
					imgs.forEach(function(img){ img.src = reader.result; });
				};
				reader.readAsDataURL(blob);
			} catch (e) {
				console.warn('Avatar inline failed:', e);
			}
		}
		function showEndMessageThenRestart() {
			var ov = document.getElementById('end-overlay');
			if (ov) { ov.style.display = 'flex'; }
			inlineAvatar();
			var cd = document.querySelector('.overlay-countdown');
			var bar = document.querySelector('.overlay-bar');
			var s = 7;
			if (cd) { cd.textContent = 'Returning to start in ' + s + 's…'; }
			if (bar) { bar.style.width = '100%'; }
			var t = setInterval(function(){ s -= 1; if (s <= 0) { clearInterval(t); } if (cd) { cd.textContent = 'Returning to start in ' + s + 's…'; } }, 1000);
			setTimeout(function(){ location.reload(); }, 7000);
		}
		function openCTA(URL) { showEndMessageThenRestart(); }
		function showURL(url) { showEndMessageThenRestart(); }
		function sendRequestToURL(url) { showEndMessageThenRestart(); }
		function outsideCallUnitComplete() {}
		(function(){
			var firstLoopHandled = false;
			var hintTimerStarted = false;
			var hintTimer = null;
			var interactedSinceLoop = false;
			function showHint(){ var ov = document.getElementById('hint-overlay'); if (ov) { ov.style.display = 'block'; } inlineAvatar(); }
			function hideHint(){ var ov = document.getElementById('hint-overlay'); if (ov) { ov.style.display = 'none'; } }
			function resetHintState(){ if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; } hintTimerStarted = false; hideHint(); }
			function onUserInteract(){ 
				if (!firstLoopHandled) { firstLoopHandled = true; } 
				interactedSinceLoop = true; 
				resetHintState(); 
				try { if (window.parent) { window.parent.postMessage({ type: 'playable-interact' }, '*'); } } catch(e){} 
				notify(false); 
			}
			function notify(active){ try { if (window.parent) { window.parent.postMessage({ type: 'playable-loop', active: !!active }, '*'); } } catch(e){} }
			var listenedVideos = new WeakSet();
			function scan(){
				var vids = document.querySelectorAll('video');
				var active = false;
				var hasVideos = vids && vids.length > 0;
				vids.forEach(function(v){
					if (!listenedVideos.has(v)) {
						listenedVideos.add(v);
						var lastT = 0;
						v.addEventListener('timeupdate', function(){
							var t = v.currentTime || 0;
							if (t < lastT - 0.2) { 
								interactedSinceLoop = false; 
								notify(true); 
							}
							lastT = t;
						}, true);
					}
					if ((v.loop || v.getAttribute('loop')!==null) && !v.paused && !interactedSinceLoop) { active = true; }
				});
				if (!hasVideos && !interactedSinceLoop) { active = true; }
				notify(active);
				if (active && !firstLoopHandled && !hintTimerStarted) {
					hintTimerStarted = true;
					hintTimer = setTimeout(function(){
						if (!firstLoopHandled) { showHint(); firstLoopHandled = true; }
					}, 4000);
				}
			}
			var mo = new MutationObserver(scan);
			mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['loop'] });
			setInterval(scan, 1000);
			document.addEventListener('play', scan, true);
			document.addEventListener('pause', scan, true);
			document.addEventListener('ended', function(){ 
				if (!firstLoopHandled && !hintTimerStarted) { 
					hintTimerStarted = true; 
					hintTimer = setTimeout(function(){ 
						if (!firstLoopHandled) { showHint(); firstLoopHandled = true; } 
					}, 4000); 
				} 
			}, true);
			document.addEventListener('touchstart', onUserInteract, true);
			document.addEventListener('pointerdown', onUserInteract, true);
			document.addEventListener('mousedown', onUserInteract, true);
			document.addEventListener('keydown', onUserInteract, true);
		})();
