<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Component Unit Tests</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.2.0/mocha.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Test environment styles */
        body { margin: 0; padding: 0; height: 3000px; /* Force scrollable area */ }
        #mocha { margin-top: 100px; background: white; position: relative; z-index: 9999; }
        .test-section { height: 800px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="mocha"></div>
    
    <!-- Dummy content for scroll context -->
    <div class="test-section">Section 1</div>
    <div class="test-section">Section 2</div>
    <div class="test-section">Section 3</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.2.0/mocha.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.3.7/chai.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sinon/15.0.1/sinon.min.js"></script>

    <script class="mocha-init">
        mocha.setup('bdd');
        mocha.checkLeaks();
    </script>

    <!-- Component Under Test -->
    <script src="../js/header.js"></script>

    <script class="mocha-exec">
        const expect = chai.expect;

        describe('Header Component', function() {
            
            // Setup/Teardown
            beforeEach(function() {
                // Reset DOM state - remove existing header/overlay
                const existingHeader = document.querySelector('.header');
                if (existingHeader) existingHeader.remove();
                const existingOverlay = document.querySelector('.menu-overlay');
                if (existingOverlay) existingOverlay.remove();
                const existingMarquee = document.querySelector('.bg-marquee-container');
                if (existingMarquee) existingMarquee.remove();
                
                // Reset body styles
                document.body.style.overflow = '';
                
                // Re-initialize
                HeaderComponent.init();
            });

            afterEach(function() {
                // Cleanup?
            });

            describe('Initialization & Injection', function() {
                it('should inject the background marquee', function() {
                    const marquee = document.querySelector('.bg-marquee-container');
                    expect(marquee).to.exist;
                    expect(marquee.querySelectorAll('.bg-marquee-row').length).to.equal(2);
                });

                it('should inject the header element with correct classes', function() {
                    const header = document.querySelector('.header');
                    expect(header).to.exist;
                    expect(header.classList.contains('header')).to.be.true;
                    // Check for CSS class that has backdrop-filter (we can't check CSS rules easily in JS without getComputedStyle)
                });

                it('should inject the hamburger button', function() {
                    const btn = document.querySelector('.hamburger-btn');
                    expect(btn).to.exist;
                });

                it('should inject the menu overlay', function() {
                    const overlay = document.querySelector('.menu-overlay');
                    expect(overlay).to.exist;
                    // Should be hidden initially
                    expect(overlay.classList.contains('active')).to.be.false;
                });
            });

            describe('Menu Interaction', function() {
                it('should open menu when hamburger is clicked', function() {
                    const btn = document.querySelector('.hamburger-btn');
                    const overlay = document.querySelector('.menu-overlay');
                    
                    // Click to open
                    btn.click();
                    
                    expect(btn.classList.contains('active')).to.be.true;
                    expect(overlay.classList.contains('active')).to.be.true;
                    expect(document.body.style.overflow).to.equal('hidden');
                });

                it('should close menu when close button is clicked', function() {
                    const btn = document.querySelector('.hamburger-btn');
                    const overlay = document.querySelector('.menu-overlay');
                    const closeBtn = document.querySelector('.menu-close-btn');
                    
                    // Open first
                    btn.click();
                    expect(overlay.classList.contains('active')).to.be.true;
                    
                    // Close
                    closeBtn.click();
                    
                    expect(overlay.classList.contains('active')).to.be.false;
                    expect(btn.classList.contains('active')).to.be.false;
                    expect(document.body.style.overflow).to.equal('');
                });

                it('should close menu when hamburger is clicked again', function() {
                    const btn = document.querySelector('.hamburger-btn');
                    const overlay = document.querySelector('.menu-overlay');
                    
                    // Open
                    btn.click();
                    expect(overlay.classList.contains('active')).to.be.true;
                    
                    // Close
                    btn.click();
                    expect(overlay.classList.contains('active')).to.be.false;
                });
            });

            describe('Scroll Behavior', function() {
                it('should hide header on scroll down and show on scroll up', function(done) {
                    const header = document.querySelector('.header');
                    
                    // Initial state: Header might be hidden or visible depending on init logic
                    // HeaderComponent init logic: header.classList.remove('visible') if at top?
                    // Let's scroll down first
                    
                    // Use setTimeout to allow async scroll handling
                    setTimeout(() => {
                        window.scrollTo(0, 500);
                        window.dispatchEvent(new Event('scroll'));
                        
                        setTimeout(() => {
                            // After scrolling down, header should be visible? 
                            // Logic: Scroll Down (Content Up) -> Show Header (if scrollY > trigger)
                            // Wait, the logic is:
                            // Scroll Down -> Show Header
                            // Scroll Up -> Hide Header
                            // OR
                            // Scroll Down -> Hide Header (out of way)
                            // Scroll Up -> Show Header (reveal)
                            // Let's check the code in header.js
                            
                            // Checking header.js logic from memory/read:
                            // if (currentScroll > lastScrollTop) { // Scrolling DOWN
                            //    header.classList.remove('visible'); // HIDE
                            // } else { // Scrolling UP
                            //    header.classList.add('visible'); // SHOW
                            // }
                            
                            // Let's verify this logic with the test
                            
                            // 1. Scroll DOWN
                            window.scrollTo(0, 600);
                            window.dispatchEvent(new Event('scroll'));
                            
                            setTimeout(() => {
                                // Should be hidden
                                expect(header.classList.contains('visible')).to.be.false;
                                
                                // 2. Scroll UP
                                window.scrollTo(0, 400);
                                window.dispatchEvent(new Event('scroll'));
                                
                                setTimeout(() => {
                                    // Should be visible
                                    expect(header.classList.contains('visible')).to.be.true;
                                    done();
                                }, 100);
                            }, 100);
                        }, 100);
                    }, 100);
                });
            });

        });

        mocha.run();
    </script>
</body>
</html>
