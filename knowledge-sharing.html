    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TY4J6ZB2NR"></script>

        gtag('config', 'G-TY4J6ZB2NR');

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <!-- Global Configuration -->
    <script src="js/config.js?v=20260313-17"></script>
    <!-- Header injected via js/header.js -->
    <script src="js/header.js?v=20260313-17"></script>

    <main class="container page-content">
        <h1 class="page-title">The Lab</h1>
        <p class="page-subtitle">Insights, articles, and resources on design, leadership, and creative strategy.</p>

        <div class="upload-notice-box" id="lab-upload-notice">
            <div class="upload-notice-row">
                <img class="upload-notice-avatar" src="assets/images/VINH_Port.png" alt="Vinh">
                <div class="upload-notice-content">
                    <div class="upload-notice-title" id="lab-upload-title">Content upload in progress</div>
                    <p class="upload-notice-text" id="lab-upload-text">New content will go live in <span class="upload-countdown" id="lab-upload-countdown">7d 00h 00m 00s</span> <span class="upload-eta">(ETA <span id="lab-upload-date"> - </span>)</span>.</p>
                </div>
            </div>
        </div>
        
        <div class="lab-actions">
            <a href="index.html" class="back-home-btn">Home</a>
        </div>
    </main>
    <script src="js/footer.js?v=20260313-17"></script>
    <script>
        (function() {
            var KEY = 'labUploadDeadlineMs';
            var countdownEl = document.getElementById('lab-upload-countdown');
            var dateEl = document.getElementById('lab-upload-date');
            var noticeEl = document.getElementById('lab-upload-notice');
            var titleEl = document.getElementById('lab-upload-title');
            var textEl = document.getElementById('lab-upload-text');
            if (!countdownEl || !dateEl || !noticeEl) return;

            var stored = 0;
            try { stored = Number(localStorage.getItem(KEY) || '0'); } catch (e) { stored = 0; }
            var now = Date.now();
            var deadlineMs = stored && isFinite(stored) && stored > now ? stored : (now + 7 * 24 * 60 * 60 * 1000);
            try { localStorage.setItem(KEY, String(deadlineMs)); } catch (e) {}

            function formatCountdown(ms) {
                var s = Math.max(0, Math.floor(ms / 1000));
                var d = Math.floor(s / 86400);
                s -= d * 86400;
                var h = Math.floor(s / 3600);
                s -= h * 3600;
                var m = Math.floor(s / 60);
                s -= m * 60;
                return d + 'd ' + String(h).padStart(2, '0') + 'h ' + String(m).padStart(2, '0') + 'm ' + String(s).padStart(2, '0') + 's';
            }

            function formatDate(ms) {
                var dt = new Date(ms);
                try {
                    return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' });
                } catch (e) {
                    return dt.toDateString();
                }
            }

            dateEl.textContent = formatDate(deadlineMs);

            function tick() {
                var left = deadlineMs - Date.now();
                if (left <= 0) {
                    countdownEl.textContent = 'now';
                    if (titleEl) titleEl.textContent = 'Upload complete';
                    if (textEl) textEl.textContent = 'New content is now live.';
                    return;
                }
                countdownEl.textContent = formatCountdown(left);
            }

            tick();
            setInterval(tick, 1000);
        })();
    </script>
</body>
</html>
