<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Update - Huynh Khac Vinh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260210-28">
    <style>
        .page-content {
            padding: var(--space-xl) var(--gutter);
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }
        .page-title {
            font-family: 'Epilogue', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: var(--space-md);
            font-weight: 300;
        }
        .page-subtitle {
            font-size: var(--h3);
            color: var(--text-secondary);
            max-width: 600px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <!-- Header injected via header.js -->

    <!-- Menu Overlay -->
    <!-- Menu Overlay injected via header.js -->

    <main class="container page-content">
        <h1 class="page-title">Social Update</h1>
        <p class="page-subtitle">Stay connected with my latest updates, thoughts, and social media activities.</p>
    </main>
    
    <script>
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.page-content').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
            observer.observe(el);
        });
    </script>
    <script src="js/footer.js"></script>
</body>
</html>
