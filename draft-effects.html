<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Effects Playground - Huynh Khac Vinh</title>
    <!-- Fonts (Giữ nguyên như trang chính để đồng bộ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- CSS Chính (để thừa hưởng các biến màu sắc, font chữ...) -->
    <link rel="stylesheet" href="style.css">

    <!-- KHU VỰC CSS THỬ NGHIỆM RIÊNG (INDEPENDENT STYLES) -->
    <style>
        /* Viết CSS thử nghiệm tại đây để không ảnh hưởng style.css chính */
        body {
            background-color: #f0f0f0; /* Màu nền tạm để dễ phân biệt */
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Ẩn thanh cuộn cho demo intro */
        }

        .test-container {
            /* Ẩn container cũ để tập trung vào Intro */
            display: none; 
        }

        /* --- CODE CSS HIỆU ỨNG INTRO --- */
        .intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FDFBF7; /* Màu nền giống trang chủ */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .intro-text {
            font-family: 'Epilogue', sans-serif; /* Font tiêu đề */
            font-size: clamp(1.8rem, 7vw, 4.8rem); /* Thu nhỏ tổng thể để tránh rớt dòng trên mobile */
            font-weight: 800; /* Bold */
            color: #1A1A1A; /* Màu đen chuẩn */
            letter-spacing: 0.12em; /* Giảm tracking để tiết kiệm chiều ngang */
            white-space: nowrap; /* Không cho xuống dòng */
            
            /* Trạng thái ban đầu trước khi animation chạy */
            opacity: 0;
            transform: translate(30px, 30px) scale(0.7);
            
            /* Gọi Animation */
            animation: introReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s; /* Đợi một chút xíu sau khi load */
        }

        /* Định nghĩa Keyframes (Intro xuất hiện) */
        @keyframes introReveal {
            0% {
                opacity: 0;
                transform: translate(30px, 30px) scale(0.7); /* Bắt đầu lệch phải 30px, dưới 30px, thu nhỏ 70% */
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1); /* Về vị trí chuẩn, size chuẩn */
            }
        }
        
        /* Tinh chỉnh mạnh hơn cho màn hình rất nhỏ */
        @media (max-width: 360px) {
            .intro-text {
                font-size: clamp(1.6rem, 6.5vw, 4.2rem);
                letter-spacing: 0.1em;
            }
        }

        /* --- CẤU HÌNH CÁC PHẦN TỬ CHO MOTION HKVinh --- */
        .segment { 
            display: inline-block; 
            vertical-align: baseline; 
            will-change: transform, opacity, width;
        }
        .space { display: inline-block; }
        .segment-uynh, .segment-hac { opacity: 0.2; }

        /* Khi bắt đầu merge, H và K chạy sang phải, uynh/hac/space co lại biến mất */
        .intro-text.merge .segment-h { animation: moveH 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .intro-text.merge .segment-k { animation: moveK 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .intro-text.merge .segment-uynh { animation: fadeShrink 1s linear forwards; }
        .intro-text.merge .segment-hac  { animation: fadeShrink 1s linear forwards; }
        .intro-text.merge .space-1      { animation: widthShrink 1s linear forwards; }
        .intro-text.merge .space-2      { animation: widthShrink 1s linear forwards; }

        @keyframes moveH {
            to { transform: translateX(var(--move-h, 0px)); }
        }
        @keyframes moveK {
            to { transform: translateX(var(--move-k, 0px)); }
        }
        @keyframes fadeShrink {
            0%   { opacity: 0.2; }
            50%  { opacity: 0.1; }
            100% { opacity: 0; width: 0; }
        }
        @keyframes widthShrink {
            to { width: 0; }
        }
        
    </style>
</head>
<body>

    <!-- CONTAINER CHO INTRO -->
    <div class="intro-container">
        <h1 class="intro-text">
            <span class="segment segment-h">H</span><span class="segment segment-uynh">uynh</span>
            <span class="space space-1">&nbsp;</span>
            <span class="segment segment-k">K</span><span class="segment segment-hac">hac</span>
            <span class="space space-2">&nbsp;</span>
            <span class="segment segment-vinh">Vinh</span>
        </h1>
    </div>

    <div class="test-container">
        <h1 class="test-label">Khu vực thử nghiệm hiệu ứng (Sandbox)</h1>
        
        <!-- KHU VỰC HTML THỬ NGHIỆM -->
        <div id="playground">
            <p>Viết code HTML của hiệu ứng vào đây...</p>
            <!-- Ví dụ: <div class="my-new-effect">...</div> -->
            
        </div>
    </div>

    <!-- KHU VỰC JS THỬ NGHIỆM RIÊNG (INDEPENDENT SCRIPT) -->
    <script>
        // Khởi tạo merge sau khi Intro xuất hiện xong
        window.addEventListener('DOMContentLoaded', () => {
            const introText = document.querySelector('.intro-text');
            const hEl   = document.querySelector('.segment-h');
            const uynhEl= document.querySelector('.segment-uynh');
            const space1= document.querySelector('.space-1');
            const kEl   = document.querySelector('.segment-k');
            const hacEl = document.querySelector('.segment-hac');
            const space2= document.querySelector('.space-2');

            // Hàm đo width hiện tại và gán width cố định để có thể animate width -> 0
            function fixWidthInline(el) {
                if (!el) return 0;
                const w = el.getBoundingClientRect().width;
                el.style.width = w + 'px';
                el.style.display = 'inline-block';
                return w;
            }

            // Sau khi animation Intro kết thúc thì bắt đầu merge
            // Thời gian introReveal: 1.2s + delay 0.2s => ~1.4s
            setTimeout(() => {
                // Đo và cố định width cho các phần cần co lại
                const wUynh  = fixWidthInline(uynhEl);
                const wSpace1= fixWidthInline(space1);
                const wHac   = fixWidthInline(hacEl);
                const wSpace2= fixWidthInline(space2);

                // Tính khoảng dịch chuyển cho H và K
                const moveH = wUynh + wSpace1;
                const moveK = wHac + wSpace2;

                // Gán CSS variables cho introText để dùng trong keyframes
                introText.style.setProperty('--move-h', moveH + 'px');
                introText.style.setProperty('--move-k', moveK + 'px');

                // Bắt đầu merge
                introText.classList.add('merge');
            }, 1450);
        });
    </script>
</body>
</html>
